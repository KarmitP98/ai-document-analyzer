[tool.pytest.ini_options]
# log_cli = true
# log_cli_level = "DEBUG"
# log_cli_format = "%(message)s"

# log_file = "pytest.log"
# log_file_level = "DEBUG"
# log_file_format = "%(asctime)s [%(levelname)8s] %(message)s (%(filename)s:%(lineno)s)"
# log_file_date_format = "%Y-%m-%d %H:%M:%S"

addopts = "--cov=. --cov-report=term-missing"

# markers = [
#     "integration: run integration tests"
# ]


# pytest may throw warnings for deprecated calls.  Ignore 3rd party calls.

filterwarnings = [
    "error",
    "ignore::UserWarning",
    "ignore:`np.object` is a deprecated alias for the builtin `object`:DeprecationWarning",
    "ignore:the imp module is deprecated in favour of importlib:DeprecationWarning",
    "ignore:pkg_resources is deprecated as an API:DeprecationWarning",
    "ignore:Deprecated call to:DeprecationWarning",
]

[tool.coverage]
    [tool.coverage.run]
    branch = true
    omit = [
    "tests/*",
    "setup.py",
    "tasks.py",
    "source/conf.py",
    "build/*",
    ]

    [tool.coverage.report]
    show_missing = true
    skip_empty = true

[tool.black]
line-length = 160
exclude = '''
/(
  | old
  | env_vocabmatching
  | frontend
  | node-modules
)/
'''

[tool.pyright]
stubPath = ""
exclude = ["**/node_modules",
    "**/__pycache__"
]
ignore = ["source/"]

reportMissingImports = true
reportMissingTypeStubs = false

pythonVersion = "3.10.11"
pythonPlatform = "Linux"

executionEnvironments = [
]

[tool.mypy]
python_version = 3.10
warn_return_any = true
warn_unused_configs = true
exclude = "tasks.py|conf.py|setup.py|build|source"

ignore_missing_imports = false
check_untyped_defs = true
no_implicit_optional = true

plugins=["numpy.typing.mypy_plugin"]


[[tool.mypy.overrides]]
module = [
    "azureml.core",
    "azureml.core.authentication",
    "azureml.core.compute",
    "azureml.core.conda_dependencies",
    "azureml.core.dataset",
    "azureml.core.environment",
    "azureml.core.experiment",
    "azureml.core.runconfig",
    "azureml.core.script_run_config",
    "azureml.core.workspace",
    "azureml.data",
    "azureml.data.dataset_consumption_config",
    "azureml.data.dataset_consumption_config",
    "azureml.data.output_dataset_config",
    "azureml.exceptions",
    "azureml.pipeline.core",
    "azureml.pipeline.core",
    "azureml.pipeline.core.schedule",
    "azureml.pipeline.steps",
    "azureml.pipeline.steps.command_step",
    "azureml.pipeline.steps.python_script_step",
]

ignore_missing_imports = true

[tool.isort]
profile = "black"
multi_line_output = 3
skip_glob = "*/site-packages/*"
[tool.ruff]
line-length = 160
exclude = ["virtual_documents/notebooks", "notebooks"]