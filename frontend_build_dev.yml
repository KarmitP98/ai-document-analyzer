# Node.js with Angular
# Build a Node.js project that uses Angular.
# This pipeline retrieves secrets from Azure Key Vault and deploys to DEV environment.

trigger:
  branches:
    include:
      - dev
  paths:
    include:
      - frontend/*

pool:
  vmImage: ubuntu-latest

variables:
  branchName: $[ replace(variables['Build.SourceBranch'], 'refs/heads/', '') ]
  artifactName: $(Build.BuildId)
  keyVaultNameDev: 'mnpaidevkvt01'
  envNameDev: 'ChromaDiverse_Dev'
  azureSubscriptionDev: 'SmartCapture_DEV'
  webAppNameDev: 'mnpaidevweb01temp'

stages:
  - stage: Audit
    displayName: NPM Audit Security Scan
    jobs:
      - job: NpmAudit
        displayName: Run npm audit and publish report
        continueOnError: true
        steps:
          - checkout: self

          - script: |
              cd frontend
              npm install stylus@github:stylus/stylus#0.56.0 --save-dev
              npm install
              npm audit --audit-level=low --json > npm-audit.json || true
            displayName: 'Run npm audit and save report'
            failOnStderr: false

          - task: PublishBuildArtifacts@1
            displayName: 'Publish npm audit report'
            inputs:
              PathtoPublish: 'frontend/npm-audit.json'
              ArtifactName: 'npm-audit-report'
              publishLocation: 'Container'

  - stage: BuildDev
    displayName: Build and Archive Frontend for Dev
    dependsOn: Audit
    condition: succeeded()
    jobs:
      - job: BuildDev
        displayName: Build Frontend for Dev
        steps:
          - checkout: self

          - task: NodeTool@0
            inputs:
              versionSpec: '16.x'
            displayName: 'Install Node.js'

          - script: |
              cd frontend
              npm install -g @angular/cli
              npm install stylus@github:stylus/stylus#0.56.0 --save-dev
              npm install
            displayName: 'npm install dependencies'

          - task: AzureKeyVault@2
            displayName: Fetch secrets for Dev environment
            name: FetchSecretsDev
            inputs:
              azureSubscription: $(azureSubscriptionDev)
              KeyVaultName: $(keyVaultNameDev)
              SecretsFilter: 'function-app-name,blob-storage-account-name,table-storage-account-name,container-name,function-key,bing-key,azure-maps-key,azure-config-auth-clientId,azure-config-b2cPolicies-names-signIn,azure-config-b2cPolicies-authorities-signIn-authority,azure-config-b2cPolicies-authorityDomain'
              RunAsPreJob: true

          - task: replacetokens@5
            displayName: Replacing Dev environment variable tokens
            inputs:
              rootDirectory: 'frontend/'
              targetFiles: '**/environment.prod.ts'
              encoding: 'auto'
              tokenPattern: '#{token}#'
              writeBOM: true
              verbosity: 'detailed'
              actionOnMissing: 'warn'
              keepToken: true
              actionOnNoFiles: 'continue'
              enableTransforms: false
              enableRecursion: false
              useLegacyPattern: false
              enableTelemetry: true

          - script: |
              cd frontend
              npm run build --if-present
            displayName: 'npm build'

          - task: ArchiveFiles@2
            displayName: 'Archive files for Dev'
            inputs:
              rootFolderOrFile: '$(System.DefaultWorkingDirectory)/frontend/dist/frontend'
              includeRootFolder: false
              archiveType: zip
              archiveFile: $(Build.ArtifactStagingDirectory)/$(Build.BuildId)_dev.zip
              replaceExistingArchive: true

          - publish: $(Build.ArtifactStagingDirectory)/$(Build.BuildId)_dev.zip
            artifact: drop-dev

  - stage: DeployDev
    displayName: Deploy to DEV
    dependsOn: BuildDev
    jobs:
      - deployment: DeployDev
        displayName: Deploy to DEV Environment
        environment: $(envNameDev)
        pool:
          vmImage: ubuntu-latest
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self
                
                - download: current
                  artifact: drop-dev

                - task: AzureWebApp@1
                  displayName: 'Azure Web App Deploy DEV'
                  inputs:
                    azureSubscription: $(azureSubscriptionDev)
                    appType: webAppLinux
                    appName: $(webAppNameDev)
                    runtimeStack: 'NODE|16.x'
                    package:  $(Pipeline.Workspace)/drop-dev/$(Build.BuildId)_dev.zip
                    startUpCommand: 'pm2 serve /home/site/wwwroot --no-daemon --spa'
