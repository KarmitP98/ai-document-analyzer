trigger:
  branches:
    include:
    - cy/32996-BICEP-Fixes
  paths:
    include:
    - code/iac

pool:
  vmImage: ubuntu-latest

stages:
- stage: Build_Validate  
  jobs:
  - job: Build
    steps:
    - task: CopyFiles@2
      displayName: 'Include templates in the artifact'
      inputs:
        Contents: |
          **/iac/**
        TargetFolder: '$(Build.ArtifactStagingDirectory)'
      
    - task: PublishBuildArtifacts@1
      displayName: 'Publish artifact'
      inputs:
        PathtoPublish: '$(Build.ArtifactStagingDirectory)'
        ArtifactName: 'drop'
        publishLocation: 'Container'
  
  - job: Test_DEV_BICEP
    steps:
    - task: AzureCLI@2
      displayName: 'Validate DEV BICEP with What-If'
      inputs:
        azureSubscription: 'SmartCapture_DEV'
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        inlineScript: |
          az deployment sub what-if \
            --location canadacentral \
            --template-file $(Build.SourcesDirectory)/code/iac/sharedServices_main.bicep \
            --parameters @$(Build.SourcesDirectory)/code/iac/sharedServices_main.parameters.dev.json
  
  - job: Test_PRD_BICEP
    steps:
    - task: AzureCLI@2
      displayName: 'Validate PRD BICEP with What-If'
      inputs:
        azureSubscription: 'spn-azure-chromadiverse-prod'
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        inlineScript: |
          az deployment sub what-if \
            --location canadacentral \
            --template-file $(Build.SourcesDirectory)/code/iac/sharedServices_main.bicep \
            --parameters @$(Build.SourcesDirectory)/code/iac/sharedServices_main.parameters.prd.json

- stage: DEV_Release
  dependsOn:
    Build_Validate
  condition: succeeded('Build_Validate')
  jobs:
    - deployment: Deploy_BICEP
      displayName: Deploy BICEP in DEV
      environment: 'INFRA_DEV'
      strategy:
        runOnce:
          deploy:
            steps:
            - task: DownloadBuildArtifacts@0
              displayName: 'Download artifact'
              inputs:
                buildType: 'current'
                downloadType: 'single'
                artifactName: 'drop'
                downloadPath: '$(System.ArtifactsDirectory)'

#            - task: AzureKeyVault@2
#              displayName: 'Get Seed Secrets from KVT'
#             inputs:
#               connectedServiceName: 'SmartCapture_DEV'
#               keyVaultName: 'mnpdinfrakvt01d'
#               secretsFilter: 'secret1, secret2'
#               runAsPreJob: false

            - task: AzureCLI@2
              displayName: 'Deploy BICEP'
              inputs:
                azureSubscription: 'SmartCapture_DEV'
                scriptType: 'bash'
                scriptLocation: 'inlineScript'
                inlineScript: |
                  az deployment sub create \
                    --location canadacentral \
                    --template-file $(System.ArtifactsDirectory)/drop/code/iac/sharedServices_main.bicep \
                    --parameters @$(System.ArtifactsDirectory)/drop/code/iac/sharedServices_main.parameters.dev.json \


- stage: PRD_Release
  dependsOn:
    DEV_Release
  condition: succeeded('Build_Validate')
  jobs:
    - deployment: Deploy_BICEP
      displayName: Deploy BICEP in PRD
      environment: 'INFRA_PRD'
      strategy:
        runOnce:
          deploy:
            steps:
            - task: DownloadBuildArtifacts@0
              displayName: 'Download artifact'
              inputs:
                buildType: 'current'
                downloadType: 'single'
                artifactName: 'drop'
                downloadPath: '$(System.ArtifactsDirectory)'

#            - task: AzureKeyVault@2
#              displayName: 'Get Seed Secrets from KVT'
#              inputs:
#                connectedServiceName: 'SmartCapture_PRD'
#                keyVaultName: 'keyvaultname1'
#                secretsFilter: 'secret1, secret2'
#                runAsPreJob: false

            - task: AzureCLI@2
              displayName: 'Deploy BICEP'
              inputs:
                azureSubscription: 'spn-azure-chromadiverse-prod'
                scriptType: 'bash'
                scriptLocation: 'inlineScript'
                inlineScript: |
                  az deployment sub create \
                    --location canadacentral \
                    --template-file $(System.ArtifactsDirectory)/drop/code/iac/sharedServices_main.bicep \
                    --parameters @$(System.ArtifactsDirectory)/drop/code/iac/sharedServices_main.parameters.prd.json